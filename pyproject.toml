[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cipherops"
version = "0.1.0"
description = "Enterprise-Grade Local Autonomous Agent with Privacy Guardrails & Human-in-the-Loop Execution"
authors = [
    { name = "Ekrem Bulgan", email = "developer@cipherops.local" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "agent", "llm", "ollama", "privacy", "autonomous", "local", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.28.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/idginity124/CipherOps"
Repository = "https://github.com/idginity124/CipherOps"
"Bug Tracker" = "https://github.com/idginity124/CipherOps/issues"

[project.scripts]
cipherops = "cipherops.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

