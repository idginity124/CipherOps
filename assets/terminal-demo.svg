<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img">
  <title>CipherOps — terminal session demo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="terminal-clip">
      <rect width="1200" height="680" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#terminal-clip)">
    <!-- Background -->
    <rect width="1200" height="680" fill="url(#bg)"/>

    <!-- Ambient glows -->
    <circle cx="200" cy="600" r="300" fill="#22d3ee" opacity=".025"/>
    <circle cx="1050" cy="80" r="250" fill="#a855f7" opacity=".030"/>

    <!-- Terminal title bar -->
    <rect width="1200" height="44" fill="url(#titlebar)"/>
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#30363d" stroke-width="1"/>

    <!-- Traffic lights -->
    <circle cx="20" cy="22" r="7" fill="#ff5f57"/>
    <circle cx="42" cy="22" r="7" fill="#febc2e"/>
    <circle cx="64" cy="22" r="7" fill="#28c840"/>

    <!-- Terminal title -->
    <text x="600" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8b949e" text-anchor="middle">cipherops chat — qwen2.5-coder:14b</text>

    <!-- Border -->
    <rect x="0.5" y="0.5" width="1199" height="679" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>

    <!-- === Line 1: Banner === -->
    <text x="60" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#22d3ee">╭─────────────────────────────────────────────────────╮</text>
    <text x="60" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#22d3ee">│</text>
    <text x="78" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#f0f6fc" font-weight="bold">CipherOps Interactive Session</text>
    <text x="60" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#22d3ee">│</text>
    <text x="78" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8b949e">Model: qwen2.5-coder:14b  │  Guardrails: Active  │  Audit: Enabled</text>
    <text x="60" y="142" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#22d3ee">│</text>
    <text x="78" y="142" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8b949e">Type 'exit' or 'quit' to end. Type 'clear' to reset history.</text>
    <text x="60" y="160" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#22d3ee">╰─────────────────────────────────────────────────────╯</text>

    <!-- === Turn 1 header === -->
    <text x="60" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#484f58">─── Turn 1 ───</text>

    <!-- User prompt -->
    <text x="60" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950" font-weight="bold">You</text>
    <text x="94" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#f0f6fc">List all TODO comments in src/ and group them by file</text>

    <!-- Thinking step -->
    <text x="60" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8b949e">🧠 Step 1: Analyzing state &amp; planning...</text>

    <!-- Tool call: execute_bash -->
    <text x="60" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#d29922">⚙️  Executing Tool:</text>
    <text x="232" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">execute_bash</text>
    <text x="336" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8b949e">args={'command': 'grep -rn "# TODO" src/'}</text>

    <!-- Tool result -->
    <text x="60" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">   ↳ SUCCESS</text>
    <text x="160" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8b949e">(Code 0):</text>
    <text x="60" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#6e7681">   src/cipherops/core/agent.py:12:  # TODO: add retry on rate-limit</text>
    <text x="60" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#6e7681">   src/cipherops/tools/bash_tool.py:7:  # TODO: configurable timeout</text>

    <!-- Agent response box -->
    <rect x="60" y="345" width="1080" height="82" rx="8" fill="#161b22" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.5"/>
    <text x="78" y="365" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#8b949e">🤖 CipherOps</text>
    <text x="78" y="387" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#f0f6fc">Found 2 TODO comments across 2 files:</text>
    <text x="78" y="407" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8b949e">  • core/agent.py:12   — add retry on rate-limit</text>
    <text x="78" y="420" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8b949e">  • tools/bash_tool.py:7 — configurable timeout</text>

    <!-- === Turn 2 header === -->
    <text x="60" y="460" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#484f58">─── Turn 2 ───</text>

    <!-- User prompt 2 -->
    <text x="60" y="484" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950" font-weight="bold">You</text>
    <text x="94" y="484" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#f0f6fc">My TCKN is 10000000146 — save it to notes.txt</text>

    <!-- PII alert -->
    <text x="60" y="508" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#bc8cff">🔒 Privacy Guardrail:</text>
    <text x="232" y="508" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#f0f6fc">Redacted 1 sensitive token</text>
    <text x="232" y="508" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8b949e" dx="195">(TCKN) before model inference.</text>

    <!-- Security block panel -->
    <rect x="60" y="522" width="1080" height="62" rx="8" fill="#1a0a0a" stroke="#f85149" stroke-width="1" stroke-opacity="0.7"/>
    <text x="78" y="542" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#f85149">🛡️  Operator Confirmation Required  —  CAUTION</text>
    <text x="78" y="562" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8b949e">Command: write_file  path=notes.txt  content="My TCKN is [REDACTED_TCKN] — ..."</text>
    <text x="78" y="576" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#f0f6fc">Execute this command on host? [y/N]: <tspan fill="#3fb950">y</tspan></text>

    <!-- Bottom prompt cursor -->
    <text x="60" y="618" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#484f58">─── Turn 3 ───</text>
    <text x="60" y="642" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950" font-weight="bold">You</text>
    <rect x="94" y="629" width="10" height="17" fill="#22d3ee" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Bottom status bar -->
    <rect x="0" y="656" width="1200" height="24" fill="#161b22"/>
    <line x1="0" y1="656" x2="1200" y2="656" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="672" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#484f58">🔐 Audit: ~/.cipherops/audit/audit_20261110.jsonl</text>
    <text x="600" y="672" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#484f58" text-anchor="middle">2 events logged  ·  0 blocked  ·  1 PII redacted</text>
    <text x="1180" y="672" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#3fb950" text-anchor="end">● ACTIVE</text>
  </g>
</svg>
